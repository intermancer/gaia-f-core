server:
  port: 8080
  servlet:
    context-path: /gaia-f

spring:
  application:
    name: gaia-f-core
  security:
    user:
      # Suppress the auto-generated password warning; all endpoints are publicly
      # accessible via SecurityConfig. Replace with real credentials if auth is added.
      name: unused
      password: unused
    
experiment:
  cycleCount: 1500
  repoCapacity: 200

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always