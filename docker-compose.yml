services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - gaia-f-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - gaia-f-network

networks:
  gaia-f-network:
    driver: bridge
